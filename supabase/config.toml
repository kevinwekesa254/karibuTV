# Supabase project config. The GitHub integration applies supabase/migrations on push to main
# and deploys the Edge Functions below.
project_id = "karibu-tv"

[api]
schemas = ["public", "graphql_public"]

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset", "https://tv.mrserengeti.com/reset", "http://localhost:5174/set-password", "https://admintv.mrserengeti.com/set-password"]
enable_signup = true

[auth.email]
enable_confirmations = false

[functions.ical-sync]
verify_jwt = true

[functions.weather]
verify_jwt = true

[functions.ai-insights]
verify_jwt = true

[functions.ai-keys]
verify_jwt = true

[functions.admin-api]
verify_jwt = true

[functions.send-emails]
# Called by pg_cron with a secret from the database, not a user login.
verify_jwt = false
