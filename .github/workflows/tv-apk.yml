# Builds the Karibu TV Android TV app (APK).
# Run it from GitHub: Actions > "TV app (APK)" > Run workflow, or push a tag like tv-v1.0.1.
# Tagged runs publish a GitHub Release; https://<your site>/tv.apk always points at the latest one.
#
# One-time secrets (Settings > Secrets and variables > Actions):
#   KARIBU_KEYSTORE_BASE64   base64 of your release keystore (.jks)
#   KARIBU_KEYSTORE_PASSWORD, KARIBU_KEY_ALIAS, KARIBU_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key: fine for testing, but TVs must
# uninstall it before installing a properly signed build.
name: TV app (APK)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site the TV app loads (no trailing slash)"
        default: "https://karibu-tv.vercel.app"
  push:
    tags: ["tv-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/tv-v* ]]; then NAME="${GITHUB_REF#refs/tags/tv-v}"; else NAME="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Keystore
        env:
          KS: ${{ secrets.KARIBU_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "KARIBU_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV";
          else echo "::warning::No KARIBU_KEYSTORE_BASE64 secret: signing with a debug key (testing only)."; fi

      - name: Build
        env:
          KARIBU_KEYSTORE_PASSWORD: ${{ secrets.KARIBU_KEYSTORE_PASSWORD }}
          KARIBU_KEY_ALIAS: ${{ secrets.KARIBU_KEY_ALIAS }}
          KARIBU_KEY_PASSWORD: ${{ secrets.KARIBU_KEY_PASSWORD }}
        run: |
          gradle -p tv-android :app:assembleRelease \
            -PKARIBU_BASE_URL="${{ github.event.inputs.base_url || 'https://karibu-tv.vercel.app' }}" \
            -PKARIBU_VERSION_NAME="${{ steps.v.outputs.name }}" -PKARIBU_VERSION_CODE="${{ steps.v.outputs.code }}"
          cp tv-android/app/build/outputs/apk/release/app-release.apk karibu-tv.apk

      - uses: actions/upload-artifact@v4
        with: { name: karibu-tv-${{ steps.v.outputs.name }}, path: karibu-tv.apk }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/tv-v')
        uses: softprops/action-gh-release@v2
        with:
          files: karibu-tv.apk
          name: Karibu TV app ${{ steps.v.outputs.name }}
